name: Develop

on:
  push:
    branches: [ develop ]

jobs:
  build:
    name: Build and execute tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: adopt
        java-version: 21
        server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: OSSRH_USERNAME # env variable for username in deploy
        server-password: OSSRH_PASSWORD # env variable for token in deploy
        gpg-private-key: ${{ secrets.SIGNING_KEY }} # Value of the GPG private key to import
        gpg-passphrase: SIGNING_PASSWORD # env variable for GPG private key passphrase

    - name: Run tests
      run: |
        mvn clean jacoco:prepare-agent install jacoco:report javadoc:jar source:jar -P '!build-extras'
        mvn site -Djacoco.skip -DskipTests -P '!build-extras'

    - name: Run SonarCloud analysis
      env:
        # to get access to secrets.SONAR_TOKEN, provide GITHUB_TOKEN
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Install docs toolchain
      working-directory: docs
      run: npm ci

    - name: Show Antora version
      working-directory: docs
      run: npx antora -v

    - name: Validate Mermaid diagrams
      working-directory: docs
      run: npm i --no-save mermaid@11 jsdom@31 puppeteer@25 && npm run validate:mermaid

    - name: Build Antora docs
      working-directory: docs
      run: npx antora antora-playbook.yml

    - name: Index the site for search
      working-directory: docs
      run: npx pagefind --site build/site

    - name: Merge documentation
      run: |
        touch ./docs/build/site/.nojekyll
        cp -r ./docs/build/site ./doc
        cp -r ./target/site ./doc/mvn-site

    - name: Deploy to GitHub Pages
      if: success()
      uses: crazy-max/ghaction-github-pages@v5
      with:
        target_branch: gh-pages
        build_dir: ./doc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to maven central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
      run: mvn deploy -P sign,build-extras --settings mvnsettings.xml -DskipTests

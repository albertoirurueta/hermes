name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build web bundle and sync Capacitor
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node <node-version>
        uses: actions/setup-node@v7
        with:
          node-version: <node-version>
          cache: <package-manager>
      - name: Install dependencies
        run: <install-command>
      - name: Build web bundle
        run: <package-manager-run> build
      - name: Sync Capacitor native projects
        run: npx cap sync
      - name: Upload synced native projects
        uses: actions/upload-artifact@v7
        with:
          name: native-projects
          path: |
            android/
            ios/

  android:
    name: Android release build
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Download synced native projects
        uses: actions/download-artifact@v8
        with:
          name: native-projects
      # upload-artifact/download-artifact round-trip through a zip that drops file modes, so the Gradle wrapper
      # comes back without its executable bit and `./gradlew` fails with "Permission denied" without this
      - name: Restore the Gradle wrapper's executable bit
        run: chmod +x android/gradlew
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Omit these two steps entirely if distribution: none
      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Write Gradle signing properties
        run: |
          cat >> android/gradle.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      # distribution: store only — uploads straight to a Play Console track
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: <android-package-name>
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production

      # distribution: internal only, and only if the user opted into Firebase App Distribution (Step 1) —
      # otherwise the plain artifact upload below is enough
      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: internal-testers
          file: android/app/build/outputs/bundle/release/app-release.aab

      # distribution: internal without Firebase — the plain fallback, no extra secrets
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: iOS release build
    needs: build-web
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Download synced native projects
        uses: actions/download-artifact@v8
        with:
          name: native-projects
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      # distribution: none only — unsigned archive; drop the Export IPA and Upload IPA steps too. Drop this step
      # instead, and keep the signed block below, when distribution is internal/store
      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Omit this whole block if distribution: none. Same automatic (cloud-managed) signing model as the
      # react-native local variant: -allowProvisioningUpdates + the App Store Connect API key let xcodebuild fetch
      # the distribution certificate/profile itself; nothing is imported into a keychain here.
      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > AuthKey.p8

      - name: Archive (signed)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/../../AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }} \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/../../AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }} \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: app-release.ipa
          path: ios/App/build/*.ipa
